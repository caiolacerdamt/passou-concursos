name: CI

on:
  pull_request:
  push:
    branches: [main]

# Commit novo no mesmo PR torna a execucao anterior obsoleta. O push na main
# usa o proprio ref como grupo e nao disputa com o PR que acabou de fechar.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A regra saiu deste YAML e virou `scripts/varredura-de-segredos.mjs`, que
      # tem teste. Regra de segurança sem teste é regra que ninguém sabe se ainda
      # pega alguma coisa. O script só usa módulos nativos do Node — não precisa
      # de `npm ci`. Ele também confere que o .env não está versionado.
      - name: Procurar credencial em arquivo versionado
        run: node scripts/varredura-de-segredos.mjs

  documentos:
    name: Integridade dos documentos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arquivos de contrato precisam existir
        run: |
          set -uo pipefail
          FALTOU=0
          for f in AGENTS.md CLAUDE.md PRD.md .specs/STATE.md .specs/ROADMAP.md docs/GITFLOW.md; do
            if [ ! -f "$f" ]; then
              echo "::error::$f não existe"
              FALTOU=1
            fi
          done
          # Specs temáticas: o texto dos requisitos (AD-086 as moveu para modulos/).
          for m in m1-banco-questoes m2-camada-ia m3-audio m4-coluna-vertebral \
                   m5-raiox-banca m6-gamificacao m7-lgpd-flywheel \
                   m8-negocio-pagamentos m9-infra; do
            if [ ! -f ".specs/modulos/$m/spec.md" ]; then
              echo "::error::spec do módulo $m não existe"
              FALTOU=1
            fi
          done
          # Specs numeradas: toda pasta de .specs/features/ precisa da própria spec.md.
          for d in .specs/features/*/; do
            [ -d "$d" ] || continue
            if [ ! -f "$d/spec.md" ]; then
              echo "::error::${d} não tem spec.md"
              FALTOU=1
            fi
          done
          [ "$FALTOU" -eq 0 ] || exit 1
          echo "Contratos presentes."

      # O STATE.md é append-only: AD existente não se edita, cria-se uma AD nova
      # que diz o que substitui. Um PR que REMOVE linhas de "## Decisions" é sinal
      # de edição retroativa. Só avisa — há reformatação legítima.
      - name: Avisar sobre remoção no log de decisões
        if: github.event_name == 'pull_request'
        run: |
          set -uo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          REMOVIDAS=$(git diff "origin/${{ github.base_ref }}...HEAD" -- .specs/STATE.md \
            | grep -c '^-[^-]' || true)
          if [ "${REMOVIDAS:-0}" -gt 0 ]; then
            echo "::warning file=.specs/STATE.md::$REMOVIDAS linha(s) removida(s) do STATE.md. \
          O log é append-only: confirme que nenhuma AD foi reescrita retroativamente."
          fi
          echo "Verificação concluída."

  app:
    name: App rápido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # `next build` roda o TypeScript: compilar já é o typecheck.
      - name: Compilar
        run: npm run build

      - name: Lint
        run: npm run lint

      # Teste unit não toca banco nem rede: roda sempre, em qualquer clone.
      - name: Testes unit
        run: npm run test:unit

  db:
    name: Testes de banco
    runs-on: ubuntu-latest
    # O projeto Supabase de desenvolvimento e compartilhado. Workflows distintos
    # entram na fila em vez de escrever nele ao mesmo tempo.
    concurrency:
      group: testes-banco-supabase-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O teste de banco escreve no projeto Supabase de desenvolvimento. Sem o
      # segredo, PULA com aviso — ausência de credencial nunca reprova o PR.
      - name: Existe o segredo do banco?
        id: segredo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "${DATABASE_URL:-}" ]; then echo "tem=true" >> "$GITHUB_OUTPUT";
          else echo "tem=false" >> "$GITHUB_OUTPUT"; fi

      - name: Testes de banco
        if: steps.segredo.outputs.tem == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run test:db

      - name: Testes de banco pulados
        if: steps.segredo.outputs.tem != 'true'
        run: |
          echo "::notice::segredo DATABASE_URL não configurado no repositório — testes de banco pulados."

  # Preserva o nome do check que a protecao da main ja conhece. O trabalho roda
  # nos dois jobs acima; este agrega o resultado sem reinstalar dependencias.
  gate:
    name: Typecheck, teste e build
    if: always()
    needs: [app, db]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir app e banco verdes
        env:
          RESULTADO_APP: ${{ needs.app.result }}
          RESULTADO_DB: ${{ needs.db.result }}
        run: |
          if [ "$RESULTADO_APP" != "success" ] || [ "$RESULTADO_DB" != "success" ]; then
            echo "::error::app=$RESULTADO_APP banco=$RESULTADO_DB"
            exit 1
          fi
          echo "App e banco verdes."

  # INFRA-09 AC2: falha de workflow SHALL NOT ser silenciosa. O job vermelho na
  # tela do GitHub só é visto por quem abre a tela; o alerta é o que chega até o
  # time. Um job só para todos, para uma execução quebrada não render vários
  # e-mails iguais.
  alerta:
    name: Alerta de falha
    if: failure()
    needs: [segredos, documentos, app, db, gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Só instala quando algo já falhou — não pesa na execução verde.
      - name: Instalar dependências
        run: npm ci

      - name: Reportar no Sentry
        env:
          # O DSN não é segredo (vai para o navegador de propósito), mas mora nos
          # segredos do repositório por ser o mesmo lugar de tudo que é ambiente.
          # Sem ele o script ainda imprime a falha no log, e não reprova.
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          DETALHE_DA_FALHA: >-
            segredos=${{ needs.segredos.result }}
            documentos=${{ needs.documentos.result }}
            app=${{ needs.app.result }}
            banco=${{ needs.db.result }}
            gate=${{ needs.gate.result }}
        run: node scripts/jobs/reportar-falha.mjs
